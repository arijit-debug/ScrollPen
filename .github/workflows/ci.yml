name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: Extension + Chrome tests + app unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The extension parses untrusted PDFs and users only get fixes from a new setup:
      # fail as soon as pdf.js publishes a release we don't ship.
      - name: pdf.js is current
        shell: bash
        run: |
          current=$(node -p "require('pdfjs-dist/package.json').version")
          latest=$(npm view pdfjs-dist version)
          if [ "$current" != "$latest" ]; then echo "::error::pdfjs-dist $current is installed, $latest is out"; exit 1; fi
      - run: npx playwright install chromium
      - run: npm run typecheck -w @scrollpen/browser-sync
      - run: npm run test:chrome
      - run: npm ci --prefix apps/desktop
      - run: npm run typecheck --prefix apps/desktop
      - run: npm run app:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e-chrome/report
  # Native (MSBuild) job is added once the hosted runners ship Visual Studio 2026,
  # which React Native for Windows 0.84 requires.
