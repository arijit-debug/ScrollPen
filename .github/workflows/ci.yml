name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extension build + Chrome tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The extension parses untrusted PDFs and users get fixes only from a new release:
      # fail as soon as pdf.js publishes a version we don't ship.
      - name: pdf.js is current
        run: |
          current=$(node -p "require('pdfjs-dist/package.json').version")
          latest=$(npm view pdfjs-dist version)
          if [ "$current" != "$latest" ]; then echo "::error::pdfjs-dist $current is installed, $latest is out"; exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm audit --audit-level=low
      - run: xvfb-run -a npm test
      - run: npm run ext:pack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e-chrome/report
