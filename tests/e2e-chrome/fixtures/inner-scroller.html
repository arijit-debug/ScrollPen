<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScrollPen fixture: inner scroller</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 240px 1fr; font: 16px/1.5 system-ui, sans-serif; }
  nav { border-right: 1px solid #8884; padding: 16px; }
  #pane { overflow-y: auto; padding: 0 24px; }
  #pane div { height: 400px; border-bottom: 1px dashed #8886; }
</style>
</head>
<body>
<nav>Sidebar (does not scroll)</nav>
<section id="pane"></section>
<script>
  const pane = document.getElementById('pane');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.textContent = 'Block ' + i + ' (top = ' + i * 400 + 'px)';
    pane.appendChild(d);
  }
</script>
</body>
</html>
